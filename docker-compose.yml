services:
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_dev
    ports:
      - "5432:5432"
    volumes:
      - argus-postgres-data:/var/lib/postgresql/data

volumes:
  argus-postgres-data: